<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haru — Today</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <script type="module" crossorigin src="/WinBar/assets/index-C9skO5BF.js"></script>
  <link rel="stylesheet" crossorigin href="/WinBar/assets/index-Chwl0KbN.css">
</head>
<body>
  <main class="stage page" id="stage">
    <div class="dial-wrap">
      <svg id="dial" viewBox="-520 -520 1040 1040" role="img" aria-label="24-hour timetable. Drag the ring to add a block."></svg>
      <canvas id="orb-canvas" aria-hidden="true"></canvas>
      <svg id="orb-layer" viewBox="-520 -520 1040 1040" aria-hidden="true"></svg>
    </div>
  </main>

  <main class="calendar-view page" id="calendar" aria-label="Calendar">
    <header class="cal-head">
      <div class="cal-title"><h1 id="cal-month"></h1><span class="meta" id="cal-year"></span></div>
      <div class="cal-nav">
        <button type="button" class="icon-btn" id="cal-prev" aria-label="Previous month"><i data-icon="chevron-left"></i></button>
        <button type="button" class="btn-sm" id="cal-today">Today</button>
        <button type="button" class="icon-btn" id="cal-next" aria-label="Next month"><i data-icon="chevron-right"></i></button>
        <button type="button" class="icon-btn" id="cal-stats" aria-label="Statistics" title="Statistics"><i data-icon="chart-column"></i></button>
      </div>
    </header>
    <div class="cal-filters" id="cal-filters" role="group" aria-label="Show"></div>
    <div class="cal-body">
      <div class="cal-main">
        <div class="cal-week" id="cal-week"></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
      <aside class="cal-day" id="cal-day" aria-live="polite"></aside>
    </div>
  </main>

  <main class="news-view page" id="news" aria-label="News">
    <div class="globe-wrap">
      <canvas id="globe" role="img" aria-label="Interactive globe"></canvas>
      <p class="globe-readout meta" id="globe-readout" aria-live="polite"></p>
    </div>
  </main>

  <!-- side drawers start tucked away; only their tab shows until it is clicked -->
  <aside class="drawer drawer-left" id="drawer-left">
    <div class="panel panel-left" id="panel-left" aria-label="Navigation and overview">
      <div class="brand">
        <i data-icon="circle-dot" class="brand-mark"></i>
        <span class="brand-name">Haru</span>
      </div>

      <nav class="nav" aria-label="Main">
        <a class="nav-item" href="#/" data-view="today">
          <i data-icon="clock"></i>Today
        </a>
        <a class="nav-item" href="#/calendar" data-view="calendar">
          <i data-icon="calendar"></i>Calendar
        </a>
        <a class="nav-item" href="#/news" data-view="news">
          <i data-icon="newspaper"></i>News
        </a>
      </nav>

      <label class="search">
        <i data-icon="search"></i>
        <input id="search" type="search" placeholder="Search tasks" autocomplete="off">
        <kbd>/</kbd>
      </label>

      <section class="section">
        <div class="section-head"><span>Now</span><span class="meta" id="clock"></span></div>
        <div class="card now-card" id="now-card"></div>
      </section>

      <section class="section">
        <div class="section-head"><span>Day</span><span class="meta" id="date"></span></div>
        <div class="rings rings-lg" id="day-rings"></div>
      </section>

      <section class="section">
        <div class="section-head"><span>Categories</span></div>
        <div class="rings rings-sm" id="cat-rings"></div>
      </section>

      <section class="section">
        <div class="section-head"><span>Templates</span><span class="meta tpl-status" id="tpl-status"></span></div>
        <ul class="tpl-list" id="tpl-list"></ul>
        <form class="tpl-save" id="tpl-save" autocomplete="off">
          <input name="name" placeholder="Save today as…" maxlength="32" aria-label="Template name">
          <button type="submit" class="icon-btn" aria-label="Save template"><i data-icon="plus"></i></button>
        </form>
      </section>

      <section class="section">
        <div class="section-head"><span>Backup</span><span class="meta backup-status" id="backup-status"></span></div>
        <div class="backup-row">
          <button type="button" class="btn-sm" id="backup-auto" aria-pressed="false">Auto-backup</button>
          <button type="button" class="btn-text" id="backup-export">Export</button>
          <button type="button" class="btn-text" id="backup-import">Import</button>
          <input type="file" id="backup-file" accept="application/json,.json" hidden>
        </div>
      </section>

      <div class="panel-foot">
        <button type="button" class="btn-text danger" id="clear">Clear all</button>
      </div>
    </div>
    <button type="button" class="drawer-tab" data-drawer="left" aria-controls="panel-left" aria-expanded="false" aria-label="Toggle overview" title="Overview  [">
      <i data-icon="chevron-right"></i><span class="tab-label">Overview</span>
    </button>
  </aside>

  <aside class="drawer drawer-right" id="drawer-right">
    <button type="button" class="drawer-tab" data-drawer="right" aria-controls="panel-right" aria-expanded="false" aria-label="Toggle tasks" title="Tasks  ]">
      <i data-icon="chevron-left"></i><span class="tab-label">Tasks</span>
    </button>
    <div class="panel panel-right" id="panel-right" aria-label="Tasks">
    <div class="panel-head">
      <span class="panel-title">Tasks</span>
      <span class="badge" id="count">0</span>
      <button type="button" class="btn-sm" id="new">
        <i data-icon="plus"></i>New
      </button>
    </div>

    <form id="editor" class="card editor" hidden autocomplete="off">
      <div class="editor-head">
        <span class="dot"></span><span id="ed-head">New task</span>
        <button type="button" class="chip done-toggle" id="ed-done" aria-pressed="false">
          <i data-icon="check"></i>Done
        </button>
      </div>
      <input class="title-input" name="title" placeholder="What are you doing?" maxlength="40">
      <div class="chips" id="chips" role="radiogroup" aria-label="Category"></div>
      <div class="times">
        <div class="time-col"><span class="meta">Start</span><button type="button" class="time-field" data-field="start" aria-label="Start time"></button></div>
        <span class="arrow"><i data-icon="arrow-right"></i></span>
        <div class="time-col"><span class="meta">End</span><button type="button" class="time-field" data-field="end" aria-label="End time"></button></div>
      </div>
      <p class="err" id="err" role="alert"></p>
      <div class="actions">
        <button type="submit" class="btn-solid">Save</button>
        <button type="button" class="btn-ghost" data-act="cancel">Cancel</button>
        <button type="button" class="btn-text danger" data-act="delete" id="del">Delete</button>
      </div>
    </form>
    <ol id="list"></ol>

    <section id="bulk" class="card bulk" hidden aria-label="Batch actions">
      <div class="bulk-head">
        <span id="bulk-count">0 selected</span>
        <button type="button" class="btn-text" data-bulk="clear">Clear <kbd>Esc</kbd></button>
      </div>
      <div class="bulk-row">
        <button type="button" class="btn-ghost" data-bulk="done">
          <i data-icon="check"></i>Mark done
        </button>
        <button type="button" class="btn-ghost" data-bulk="undone">Mark not done</button>
      </div>
      <div class="bulk-field"><span class="meta">Category</span><div class="chips" id="bulk-cats"></div></div>
      <div class="bulk-field">
        <span class="meta">Move</span>
        <div class="seg">
          <button type="button" data-bulk="move" data-by="-60">−1h</button>
          <button type="button" data-bulk="move" data-by="-15">−15m</button>
          <button type="button" data-bulk="move" data-by="15">+15m</button>
          <button type="button" data-bulk="move" data-by="60">+1h</button>
        </div>
      </div>
      <div class="bulk-field">
        <span class="meta">Length</span>
        <div class="seg">
          <button type="button" data-bulk="len" data-by="-30">−30m</button>
          <button type="button" data-bulk="len" data-by="-15">−15m</button>
          <button type="button" data-bulk="len" data-by="15">+15m</button>
          <button type="button" data-bulk="len" data-by="30">+30m</button>
        </div>
      </div>
      <p class="err" id="bulk-err" role="alert"></p>
      <button type="button" class="btn-danger" data-bulk="delete">Delete</button>
    </section>
    </div>
  </aside>

  <!-- News page's right drawer: the live headlines (all places, or the one picked on the globe) -->
  <aside class="drawer drawer-right drawer-news" id="drawer-news" hidden>
    <button type="button" class="drawer-tab" data-drawer="right" aria-controls="panel-news" aria-expanded="false" aria-label="Toggle news" title="News  ]">
      <i data-icon="chevron-left"></i><span class="tab-label">News</span>
    </button>
    <div class="panel panel-right" id="panel-news" aria-label="News">
      <div class="panel-head">
        <span class="panel-title">News</span>
        <span class="live-dot" id="news-live" title="Live"></span>
        <span class="meta news-updated" id="news-updated"></span>
      </div>
      <section class="news-week" id="news-week" aria-label="This week"></section>
      <div class="news-scope" id="news-scope"></div>
      <div class="news-topics" id="news-topics" role="group" aria-label="Topics"></div>
      <ol class="news-list" id="news-list"></ol>
    </div>
  </aside>

</body>
</html>
