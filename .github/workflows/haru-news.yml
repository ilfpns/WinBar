# Haru's News page: refresh the headlines on the published site (gh-pages) every 10 minutes.
# Only data/news.json changes; the rest of the site is published by `npm run deploy` in haru/.
name: Haru news

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # keep-alive below

# one gh-pages writer at a time (a run waits for the one before it)
concurrency:
  group: haru-pages
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: haru/scripts
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch headlines
        run: node haru/scripts/fetch-news.mjs site/data/news.json
      # the school's class timetable (컴시간알리미) rides along: it changes from day to day only now and then
      - name: Fetch school timetable
        continue-on-error: true
        run: node haru/scripts/fetch-school-timetable.mjs site/data/school-timetable.json
      - name: Publish
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # start from the newest gh-pages (a deploy or a change-request outcome may have landed meanwhile), then
          # lay only this run's files on it, so nothing published since the checkout is overwritten
          mkdir -p /tmp/run && cp data/news.json /tmp/run/ && (cp data/school-timetable.json /tmp/run/ 2>/dev/null || true)
          git fetch -q --depth 1 origin gh-pages && git reset -q --hard FETCH_HEAD
          cp /tmp/run/news.json data/ && (cp /tmp/run/school-timetable.json data/ 2>/dev/null || true)
          git add data/news.json
          git add data/school-timetable.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          # keep gh-pages a single snapshot commit instead of growing by 144 commits a day
          git commit -q --amend -m "Deploy to GitHub Pages"
          git push -q -f origin gh-pages
      # GitHub pauses scheduled workflows in a repo with no activity for 60 days;
      # re-enabling the workflow through the API restarts that clock, so it keeps running indefinitely
      - name: Keep the schedule alive
        if: github.event_name == 'workflow_dispatch' || endsWith(format('{0}', github.run_number), '0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/haru-news.yml/enable"
