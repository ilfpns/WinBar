# Haru's News page: refresh the headlines (and the Notion attendance) on the published site (gh-pages) every
# 10 minutes. Only data/news.json and data/attendance.json change; the rest is published by `npm run deploy`.
name: Haru news

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # keep-alive below

concurrency:
  group: haru-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: haru/scripts
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch headlines
        run: node haru/scripts/fetch-news.mjs site/data/news.json
      # attendance both ways with the Notion database: Haru check-ins ticked there, Notion's brought here
      # (a failure here never holds up the headlines)
      - name: Sync attendance
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: node haru/scripts/fetch-attendance.mjs site/data/attendance.json
      - name: Publish
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git add data/attendance.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          # keep gh-pages a single snapshot commit instead of growing by 144 commits a day
          git commit -q --amend -m "Deploy to GitHub Pages"
          git push -q -f origin gh-pages
      # GitHub pauses scheduled workflows in a repo with no activity for 60 days;
      # re-enabling the workflow through the API restarts that clock, so it keeps running indefinitely
      - name: Keep the schedule alive
        if: github.event_name == 'workflow_dispatch' || endsWith(format('{0}', github.run_number), '0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/haru-news.yml/enable"
