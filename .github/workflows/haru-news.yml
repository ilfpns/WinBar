# Haru's News page: refresh the headlines on the published site (gh-pages) every 10 minutes.
# Only data/news.json changes; the rest of the site is published by `npm run deploy` in haru/.
name: Haru news

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: haru-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: haru/scripts
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch headlines
        run: node haru/scripts/fetch-news.mjs site/data/news.json
      - name: Publish
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          # keep gh-pages a single snapshot commit instead of growing by 144 commits a day
          git commit -q --amend -m "Deploy to GitHub Pages"
          git push -q -f origin gh-pages
